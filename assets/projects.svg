    <path d="M5 12V7a8 8 0 0 1 16 0v5" fill="none" stroke="#00ffcc" stroke-width="2.2"/>
    <circle cx="13" cy="22" r="2.6" fill="#00ffcc"/>
  </g>
  <text class="name" x="68" y="54">cuscet-label</text>
  <rect x="330" y="30" width="124" height="28" rx="4" fill="none" stroke="#ff2bd6" stroke-width="1.6" transform="rotate(-6 392 44)"/>
  <text class="stamp" x="392" y="49" text-anchor="middle" transform="rotate(-6 392 44)">CLASSIFIED</text>
  <text class="meta" x="26" y="96">PRIVATE REPOSITORY · ACCESS RESTRICTED</text>
  <text class="enc" x="26" y="128" style="animation-delay:0.7s">▓▒░█▓░▒▓█░▒▓▓░█▒░▓▒█░▓▒░</text>
  <circle cx="32" cy="166" r="6" fill="#3178c6"/>
  <text class="meta" x="46" y="171">TypeScript</text>
